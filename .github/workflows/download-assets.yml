name: Download assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 download_assets.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets
          git commit -m "add assets" || echo "nothing to commit"
          git push
